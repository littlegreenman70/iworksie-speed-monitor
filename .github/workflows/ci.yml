name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dev tooling (Strauss 0.32 / Symfony Console) needs PHP 8+. Plugin runtime remains PHP 7.4+.
        php: ['8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          # Drop the local path repo (missing on the runner) so Composer uses the public VCS repo.
          # composer.lock is gitignored; resolve fresh from composer.json.
          php -r '
          $path = "composer.json";
          $j = json_decode( file_get_contents( $path ), true );
          $j["repositories"] = array_values( array_filter(
            isset( $j["repositories"] ) ? $j["repositories"] : array(),
            static function ( $r ) {
              return ( isset( $r["type"] ) ? $r["type"] : "" ) !== "path";
            }
          ) );
          file_put_contents( $path, json_encode( $j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES ) . "\n" );
          '
          composer update --no-interaction --prefer-dist

      - name: PHPCS
        run: composer lint

      - name: PHPStan
        run: composer analyse

      - name: Unit tests
        run: composer test:unit

  integration:
    name: Integration (WP ${{ matrix.wp }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported WordPress and newest. PHP 7.4 runtime is covered by the php74-runtime job.
          - wp: '6.5.7'
            php: '8.3'
          - wp: 'latest'
            php: '8.3'
          - wp: 'latest'
            php: '8.4'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: iworks_tests_sm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install dependencies
        run: |
          php -r '
          $path = "composer.json";
          $j = json_decode( file_get_contents( $path ), true );
          $j["repositories"] = array_values( array_filter(
            isset( $j["repositories"] ) ? $j["repositories"] : array(),
            static function ( $r ) {
              return ( isset( $r["type"] ) ? $r["type"] : "" ) !== "path";
            }
          ) );
          file_put_contents( $path, json_encode( $j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES ) . "\n" );
          '
          composer update --no-interaction --prefer-dist

      - name: Install WP test suite
        run: bash bin/install-wp-tests.sh iworks_tests_sm root '' 127.0.0.1 ${{ matrix.wp }}

      - name: Integration tests
        env:
          WP_TESTS_DIR: ${{ github.workspace }}/tests/wordpress/wordpress-tests-lib
          IWIESP_TESTSUITE: integration
        run: composer test:integration

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Build plugin
        run: |
          php -r '
          $path = "composer.json";
          $j = json_decode( file_get_contents( $path ), true );
          $j["repositories"] = array_values( array_filter(
            isset( $j["repositories"] ) ? $j["repositories"] : array(),
            static function ( $r ) {
              return ( isset( $r["type"] ) ? $r["type"] : "" ) !== "path";
            }
          ) );
          file_put_contents( $path, json_encode( $j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES ) . "\n" );
          '
          composer update --no-interaction --prefer-dist
          composer build

      - name: Upload built plugin
        uses: actions/upload-artifact@v4
        with:
          name: iworksie-speed-monitor-build
          path: build/iworksie-speed-monitor
          retention-days: 2

      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/iworksie-speed-monitor'
          exclude-directories: 'vendor,vendor-prefixed/composer'

  php74-syntax:
    name: PHP 7.4 syntax (built plugin)
    needs: plugin-check
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Download built plugin
        uses: actions/download-artifact@v4
        with:
          name: iworksie-speed-monitor-build
          path: build/iworksie-speed-monitor

      - name: Lint every shipped PHP file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null; then
              echo "FAIL: $file"
              fail=1
            fi
          done < <(find build/iworksie-speed-monitor -type f -name '*.php' -print0)
          if [ "$fail" -ne 0 ]; then
            echo "PHP 7.4 syntax errors found."
            exit 1
          fi
          echo "All shipped PHP files parse on PHP 7.4."

  php74-runtime:
    name: PHP 7.4 runtime (unit + integration, WP 6.5.7)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: iworks_tests_sm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      # Dev tooling (Strauss) needs PHP 8, so build vendor-prefixed on 8.3 first...
      - name: Setup PHP 8.3 (build)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Build vendor-prefixed
        run: |
          php -r '
          $path = "composer.json";
          $j = json_decode( file_get_contents( $path ), true );
          $j["repositories"] = array_values( array_filter(
            isset( $j["repositories"] ) ? $j["repositories"] : array(),
            static function ( $r ) {
              return ( isset( $r["type"] ) ? $r["type"] : "" ) !== "path";
            }
          ) );
          file_put_contents( $path, json_encode( $j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES ) . "\n" );
          '
          composer update --no-interaction --prefer-dist

      # ...then install a PHP 7.4-compatible test toolchain in a separate directory.
      - name: PHP 7.4 test dependencies
        run: |
          rm -rf vendor
          mkdir -p /tmp/t74
          cat > /tmp/t74/composer.json <<'JSON'
          {
            "require-dev": {
              "phpunit/phpunit": "^9.6",
              "yoast/phpunit-polyfills": "^2.0",
              "brain/monkey": "^2.6"
            },
            "autoload": { "psr-4": { "IWorksIE\\SpeedMonitor\\": "src/" } },
            "autoload-dev": { "psr-4": { "IWorksIE\\SpeedMonitor\\Tests\\": "tests/" } },
            "config": { "platform": { "php": "7.4.33" } }
          }
          JSON
          cp /tmp/t74/composer.json composer.json
          composer update --no-interaction --prefer-dist --no-scripts

      - name: Setup PHP 7.4 (run)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli
          coverage: none

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WP test suite
        run: bash bin/install-wp-tests.sh iworks_tests_sm root '' 127.0.0.1 6.5.7

      - name: Unit + integration on PHP 7.4
        env:
          WP_TESTS_DIR: ${{ github.workspace }}/tests/wordpress/wordpress-tests-lib
        run: |
          php -v
          IWIESP_TESTSUITE=unit vendor/bin/phpunit --testsuite unit
          IWIESP_TESTSUITE=integration vendor/bin/phpunit --testsuite integration
          IWIESP_TESTSUITE=integration vendor/bin/phpunit --testsuite integration --group ajax
